<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market Structure Visualizer | Ogaties Institute</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* 背景は完全な黒、文字はブルームバーグ風の白 */
        body { 
            margin: 0; 
            background-color: #000000; 
            color: #FFFFFF; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }
        
        #ui { 
            position: absolute; 
            top: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(30,30,30,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 10; 
            pointer-events: none; 
        }

        .btn-group { pointer-events: auto; display: flex; gap: 10px; margin-top: 15px; }
        
        /* ボタンのデザイン：オレンジの枠線と白文字 */
        button { 
            background: rgba(0,0,0,0.6); 
            border: 1px solid #FF8800; 
            color: #FFFFFF; 
            padding: 8px 20px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 12px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { background: rgba(255, 136, 0, 0.2); }
        button.active { 
            background: #FF8800; 
            color: #000; 
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.5); 
        }
        
        h1 { margin: 0; font-size: 18px; font-weight: bold; color: #FFFFFF; }
        p { margin: 5px 0; font-size: 12px; color: #FF8800; font-weight: bold; }

        #label-container { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            text-align: left; 
            pointer-events: none; 
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
        .legend { font-size: 11px; color: #AAAAAA; margin-bottom: 5px; }
        #status { font-size: 16px; color: #FF8800; font-family: monospace; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>NIKKEI 225 STRUCTURAL VISUALIZER</h1>
        <p>Market Topology Analysis</p>
        <div class="btn-group">
            <button id="btn-1989" onclick="switchMode('1989')">1989: BUBBLE GHOST</button>
            <button id="btn-2026" class="active" onclick="switchMode('2026')">2026: STEEL FRAMEWORK</button>
        </div>
    </div>
    
    <div id="label-container">
        <div class="legend">TERMINAL: OGATIES MARKET OBSERVER</div>
        <div id="status">MODE: 2026 (Structural Integrity)</div>
    </div>

    <script>
        let scene, camera, renderer, controls, points, lines;
        const tickers = ['9983.T', '8035.T', '6758.T', '9984.T', '8306.T', '8001.T', '7203.T', '9101.T', '4502.T', '6501.T', '4063.T'];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 6, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // グリッド：暗いオレンジで「白熱灯の熱」を表現
            const grid = new THREE.GridHelper(30, 30, 0x442200, 0x111111);
            scene.add(grid);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xFFCC00, 2); // 少し黄色寄りの温かい光
            pointLight.position.set(10, 20, 10);
            scene.add(pointLight);

            createStructure('2026');
            animate();
        }

        function createStructure(mode) {
            if (points) scene.remove(points);
            if (lines) scene.remove(lines);

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const pts = [];

            const numPoints = tickers.length;

            for (let i = 0; i < numPoints; i++) {
                let x, y, z;
                if (mode === '1989') {
                    const angle = (i / numPoints) * Math.PI * 2;
                    x = Math.cos(angle) * 6;
                    y = (Math.random() - 0.5) * 1; 
                    z = Math.sin(angle) * 6;
                } else {
                    x = (Math.random() - 0.5) * 6;
                    y = (i * 0.8) - 4;
                    z = (Math.random() - 0.5) * 6;
                }
                pts.push(new THREE.Vector3(x, y, z));
                positions.push(x, y, z);
                colors.push(1, 0.5, 0); // 基本オレンジ
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            // 点の素材：白熱灯のフィラメントのように光る
            const material = new THREE.PointsMaterial({ 
                size: 0.5, 
                color: 0xFF9900,
                transparent: true,
                opacity: 0.9
            });
            points = new THREE.Points(geometry, material);
            scene.add(points);

            // 線のグラデーション用シェーダー
            const linePositions = [];
            const lineColors = [];

            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const dist = pts[i].distanceTo(pts[j]);
                    const threshold = mode === '1989' ? 12 : 7; 
                    if (dist < threshold) {
                        linePositions.push(pts[i].x, pts[i].y, pts[i].z);
                        linePositions.push(pts[j].x, pts[j].y, pts[j].z);
                        
                        // Y軸の高さに応じて色を変える（グラデーション）
                        const color1 = new THREE.Color().setHSL(0.08, 1, 0.5 + (pts[i].y + 4) / 20);
                        const color2 = new THREE.Color().setHSL(0.08, 1, 0.5 + (pts[j].y + 4) / 20);
                        lineColors.push(color1.r, color1.g, color1.b);
                        lineColors.push(color2.r, color2.g, color2.b);
                    }
                }
            }

            const lineGeometry = new THREE.BufferGeometry();
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

            const lineMaterial = new THREE.LineBasicMaterial({ 
                vertexColors: true, 
                transparent: true, 
                opacity: 0.4 
            });
            lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);
        }

        function switchMode(mode) {
            document.getElementById('btn-1989').className = mode === '1989' ? 'active' : '';
            document.getElementById('btn-2026').className = mode === '2026' ? 'active' : '';
            document.getElementById('status').innerText = `MODE: ${mode === '1989' ? '1989 (Bubble Ghost)' : '2026 (Structural Integrity)'}`;
            createStructure(mode);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
