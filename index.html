<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market Structure Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; background-color: #000000; color: #FF8800; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        .btn-group { pointer-events: auto; display: flex; gap: 10px; margin-top: 10px; }
        button { 
            background: #21262d; border: 1px solid #30363d; color: #58a6ff; 
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: 0.2s;
        }
        button:hover { background: #30363d; border-color: #8b949e; }
        button.active { background: #1f6feb; color: white; border-color: #388bfd; }
        h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        #label-container { position: absolute; bottom: 20px; right: 20px; text-align: right; pointer-events: none; }
        .legend { font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Topology of the Nikkei 225</h1>
        <p>Rotate and Zoom to explore the market's 3D geometry.</p>
        <div class="btn-group">
            <button id="btn-1989" onclick="switchMode('1989')">1989: Bubble Ghost</button>
            <button id="btn-2026" class="active" onclick="switchMode('2026')">2026: Steel Framework</button>
        </div>
    </div>
    
    <div id="label-container">
        <div class="legend">Visualization: 2026 Market Observer</div>
        <div id="status" style="color: #58a6ff; font-weight: bold;">MODE: 2026 (High Persistence)</div>
    </div>

    <script>
        let scene, camera, renderer, controls, points, lines;
        const tickers = ['9983.T', '8035.T', '6758.T', '9984.T', '8306.T', '8001.T', '7203.T', '9101.T'];
        
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const grid = new THREE.GridHelper(20, 20, 0x30363d, 0x21262d);
            scene.add(grid);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x58a6ff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            createStructure('2026');
            animate();
        }

        function createStructure(mode) {
            if (points) scene.remove(points);
            if (lines) scene.remove(lines);

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const lineGeometry = new THREE.BufferGeometry();
            const linePositions = [];

            const numPoints = tickers.length;
            const pts = [];

            for (let i = 0; i < numPoints; i++) {
                let x, y, z;
                if (mode === '1989') {
                    const angle = (i / numPoints) * Math.PI * 2;
                    x = Math.cos(angle) * 4;
                    y = (Math.random() - 0.5) * 0.5; 
                    z = Math.sin(angle) * 4;
                } else {
                    x = (i % 2 === 0 ? 1 : -1) * (2 + Math.random() * 2);
                    y = (i * 1.2) - 4;
                    z = (Math.random() - 0.5) * 5;
                }
                pts.push(new THREE.Vector3(x, y, z));
                positions.push(x, y, z);
                
                const color = mode === '1989' ? new THREE.Color(0xa371f7) : new THREE.Color(0x3fb950);
                colors.push(color.r, color.g, color.b);
            }

            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const dist = pts[i].distanceTo(pts[j]);
                    const threshold = mode === '1989' ? 10 : 6; 
                    if (dist < threshold) {
                        linePositions.push(pts[i].x, pts[i].y, pts[i].z);
                        linePositions.push(pts[j].x, pts[j].y, pts[j].z);
                    }
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({ size: 0.4, vertexColors: true });
            points = new THREE.Points(geometry, material);
            scene.add(points);

            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: mode === '1989' ? 0xa371f7 : 0x3fb950, 
                transparent: true, 
                opacity: 0.3 
            });
            lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);
        }

        function switchMode(mode) {
            document.getElementById('btn-1989').className = mode === '1989' ? 'active' : '';
            document.getElementById('btn-2026').className = mode === '2026' ? 'active' : '';
            document.getElementById('status').innerText = `MODE: ${mode === '1989' ? '1989 (Bubble Ghost)' : '2026 (Structural Integrity)'}`;
            document.getElementById('status').style.color = mode === '1989' ? '#a371f7' : '#3fb950';
            createStructure(mode);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
